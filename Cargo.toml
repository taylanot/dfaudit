[ package ]
name = "dfaudit"
version = "1.0.0"
edition = "2024"

[ dependencies ]
clap = { version = "4", features = ["derive"] }
walkdir = "2.5"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
glob = "0.3"
